version: '3.9'

x-common-env: &common-env
  APP_ENV: production
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: hrms
  DB_USERNAME: hrms
  DB_PASSWORD: hrms_strong_password
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: hrms-nginx
    ports:
      - "8080:80"
    volumes:
      - ./architecture/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tenant-service
      - onboarding-service
      - payroll-service
      - user-service
      - reporting-service
    restart: unless-stopped

  tenant-service:
    image: php:8.3-cli-alpine
    container_name: tenant-service
    working_dir: /app
    command: sh -c "php -S 0.0.0.0:8000 -t /app"
    volumes:
      - ./services/tenant:/app
    environment:
      <<: *common-env
      SERVICE_NAME: tenant
      STRIPE_SECRET: sk_test_replace_me
    depends_on:
      - mysql
      - redis

  onboarding-service:
    image: php:8.3-cli-alpine
    container_name: onboarding-service
    working_dir: /app
    command: sh -c "php -S 0.0.0.0:8001 -t /app"
    volumes:
      - ./services/onboarding:/app
    environment:
      <<: *common-env
      SERVICE_NAME: onboarding
    depends_on:
      - mysql
      - redis

  payroll-service:
    image: php:8.3-cli-alpine
    container_name: payroll-service
    working_dir: /app
    command: sh -c "php -S 0.0.0.0:8002 -t /app"
    volumes:
      - ./services/payroll:/app
    environment:
      <<: *common-env
      SERVICE_NAME: payroll
    depends_on:
      - mysql
      - redis

  user-service:
    image: php:8.3-cli-alpine
    container_name: user-service
    working_dir: /app
    command: sh -c "php -S 0.0.0.0:8003 -t /app"
    volumes:
      - ./services/user:/app
    environment:
      <<: *common-env
      SERVICE_NAME: user
    depends_on:
      - mysql
      - redis

  reporting-service:
    image: php:8.3-cli-alpine
    container_name: reporting-service
    working_dir: /app
    command: sh -c "php -S 0.0.0.0:8004 -t /app"
    volumes:
      - ./services/reporting:/app
    environment:
      <<: *common-env
      SERVICE_NAME: reporting
    depends_on:
      - mysql
      - redis

  web:
    image: node:22-alpine
    container_name: hrms-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./ui:/app
    depends_on:
      - nginx

  mysql:
    image: mysql:8.4
    container_name: hrms-mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=512M
      --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hrms
      MYSQL_USER: hrms
      MYSQL_PASSWORD: hrms_strong_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: hrms-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mysql-data:
